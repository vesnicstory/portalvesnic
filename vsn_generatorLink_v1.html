<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vesnicstory - Secure Link Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F7F7F6; } 
        
        /* Soft Elegant Shadows */
        .aesthetic-shadow {
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        }
    </style>
    <!-- Memanggil file pengaturan -->
    <script src="pengaturan.js"></script>
</head>
<body class="text-stone-900 flex flex-col min-h-screen selection:bg-stone-300 selection:text-stone-900">

    <!-- Header Vesnicstory -->
    <header class="bg-stone-900/95 backdrop-blur-md sticky top-0 z-40 border-b-2 border-stone-800 shadow-lg">
        <div class="max-w-xl mx-auto w-full px-6 py-5 flex items-center justify-center sm:justify-start gap-5">
            <!-- LOGO VESNICSTORY -->
            <img src="Vesnicstory_Logo_White.png" alt="Vesnicstory Logo" class="h-10 md:h-12 w-auto object-contain">
            
            <div class="hidden sm:block border-l-2 border-stone-700 pl-5">
                <h1 class="font-extrabold text-base text-stone-100 tracking-[0.2em] uppercase">Portal Link</h1>
                <p class="text-xs text-stone-400 font-bold uppercase tracking-widest mt-0.5">Admin Generator</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-6 py-12 w-full">
        <div class="bg-white max-w-xl w-full rounded-[2rem] aesthetic-shadow border-2 border-stone-100 overflow-hidden">
            
            <div class="p-8 md:p-10 space-y-8">
                
                <div class="hidden">
                    <input type="text" id="baseUrl">
                </div>

                <!-- Bagian Data Klien -->
                <div class="bg-stone-50 p-6 rounded-2xl border-2 border-stone-200 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Kolom Nama -->
                        <div>
                            <label class="block text-xs font-extrabold text-stone-600 mb-2 uppercase tracking-wider">Nama Klien (Opsional)</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-user-tag text-stone-400"></i>
                                </div>
                                <input type="text" id="clientName" placeholder="Cth: Deni & Maria"
                                    class="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-stone-200 rounded-xl focus:border-stone-500 font-medium outline-none transition-all text-base text-stone-900 shadow-sm">
                            </div>
                        </div>

                        <!-- Kolom WA Klien -->
                        <div>
                            <label class="block text-xs font-extrabold text-stone-600 mb-2 uppercase tracking-wider">No. WA Klien (Opsional)</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-brands fa-whatsapp text-stone-400"></i>
                                </div>
                                <input type="number" id="clientPhone" placeholder="Cth: 081234..."
                                    class="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-stone-200 rounded-xl focus:border-stone-500 font-medium outline-none transition-all text-base text-stone-900 shadow-sm">
                            </div>
                        </div>
                    </div>

                    <div class="h-px bg-stone-200 w-full my-2"></div>

                    <div>
                        <label class="block text-xs font-extrabold text-stone-600 mb-2 uppercase tracking-wider">Link Google Drive Asli <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-brands fa-google-drive text-stone-400"></i>
                            </div>
                            <input type="text" id="driveLink" placeholder="Paste link folder di sini..."
                                class="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-stone-200 rounded-xl focus:border-stone-500 font-medium outline-none transition-all text-base text-stone-900 shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-extrabold text-stone-600 mb-2 uppercase tracking-wider">Batas Kuota Foto (Opsional)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="fa-solid fa-shield-halved text-stone-400"></i>
                            </div>
                            <input type="number" id="kuota" placeholder="Kosongkan jika bebas limit"
                                class="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-stone-200 rounded-xl focus:border-stone-500 font-medium outline-none transition-all text-base text-stone-900 shadow-sm">
                        </div>
                    </div>
                </div>

                <!-- BAGIAN KUSTOMISASI PESAN WHATSAPP (NO-CODE) -->
                <div>
                    <label class="block text-sm font-extrabold text-stone-700 mb-2 tracking-wide">Format Pesan WhatsApp (Auto-Save)</label>
                    <p class="text-xs text-stone-500 mb-3 font-medium leading-relaxed">
                        Gunakan kode <span class="font-mono bg-stone-200 text-stone-800 px-1.5 py-0.5 rounded font-bold">[NAMA]</span> untuk menyisipkan nama, dan <span class="font-mono bg-stone-200 text-stone-800 px-1.5 py-0.5 rounded font-bold">[LINK]</span> untuk tautan galeri.
                    </p>
                    <textarea id="waTemplate" oninput="saveTemplate()" rows="4" 
                        class="w-full bg-stone-50 border-2 border-stone-200 rounded-xl p-4 text-base font-medium text-stone-800 focus:border-stone-500 outline-none transition-all resize-none shadow-inner"></textarea>
                    <div class="flex justify-end mt-2">
                        <button onclick="resetTemplate()" class="text-[11px] font-extrabold text-stone-400 hover:text-stone-700 transition-colors uppercase tracking-wider"><i class="fa-solid fa-rotate-left mr-1"></i> Reset ke Standar</button>
                    </div>
                </div>

                <button onclick="generateLink()" class="w-full py-5 bg-stone-900 hover:bg-stone-800 text-white font-extrabold rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl text-lg uppercase tracking-widest">
                    <i class="fa-solid fa-wand-magic-sparkles text-xl"></i> Buat Link Aman
                </button>

                <!-- KOTAK HASIL -->
                <div id="resultBox" class="hidden mt-4 bg-stone-50 border-2 border-stone-200 rounded-2xl p-6 transition-all">
                    <span class="text-sm font-extrabold text-green-600 uppercase tracking-wider mb-3 block"><i class="fa-solid fa-check-circle mr-1"></i> Link Siap Dikirim!</span>
                    <textarea id="finalUrl" readonly class="w-full bg-white border-2 border-stone-200 rounded-xl p-4 text-sm font-medium text-stone-700 outline-none resize-none h-24 font-mono shadow-inner"></textarea>
                    
                    <!-- Dua Tombol Aksi -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-5">
                        <button onclick="copyToClipboard()" class="w-full py-4 bg-white hover:bg-stone-100 text-stone-900 border-2 border-stone-200 hover:border-stone-300 text-sm font-extrabold rounded-xl transition-all flex justify-center items-center gap-2 shadow-sm">
                            <i class="fa-solid fa-copy"></i> Salin Teks
                        </button>
                        <button id="btnSendWA" onclick="sendToClientWA()" class="w-full py-4 bg-stone-900 hover:bg-stone-800 text-white text-sm font-extrabold rounded-xl transition-all flex justify-center items-center gap-2 shadow-md">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Kirim ke Klien
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Alert Notifikasi -->
    <div id="customAlert" class="fixed top-6 bg-stone-900 border-2 border-stone-700 text-white px-6 py-4 rounded-xl shadow-2xl z-50 flex items-center gap-3 transition-all duration-300 transform -translate-y-32 opacity-0">
        <i id="alertIcon" class="fa-solid fa-circle-check text-green-400"></i>
        <span id="alertText" class="text-sm font-bold tracking-wide">Teks tersalin!</span>
    </div>

    <!-- Footer dengan Logo Niclaas -->
    <footer class="py-10 flex flex-col items-center justify-center gap-5 border-t-2 border-stone-200 bg-stone-100/80 w-full">
        <p class="text-xs text-stone-500 uppercase tracking-[0.3em] font-bold">Engineered & Developed By</p>
        
        <!-- LOGO NICLAAS -->
        <div class="opacity-80 hover:opacity-100 transition-opacity">
            <img src="niclaas_logo_01.png" alt="Niclaas Logo" class="h-7 w-auto object-contain">
        </div>
    </footer>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const DEFAULT_TEMPLATE = "Halo [NAMA],\n\nBerikut adalah link galeri foto eksklusif Anda untuk proses seleksi:\n[LINK]\n\nSilakan klik link di atas. Jika ada pertanyaan, balas pesan ini ya. Terima kasih!";

        document.addEventListener("DOMContentLoaded", () => {
            let currentUrl = window.location.href.split('?')[0].split('#')[0];
            let portalUrl = currentUrl.includes("generatorLink.html") ? currentUrl.replace("generatorLink.html", "") : currentUrl.substring(0, currentUrl.lastIndexOf("/") + 1);
            document.getElementById('baseUrl').value = portalUrl;

            const savedTemplate = localStorage.getItem('customWaTemplate');
            if (savedTemplate) {
                document.getElementById('waTemplate').value = savedTemplate;
            } else {
                document.getElementById('waTemplate').value = DEFAULT_TEMPLATE;
            }
        });

        function saveTemplate() {
            const currentText = document.getElementById('waTemplate').value;
            localStorage.setItem('customWaTemplate', currentText);
        }

        function resetTemplate() {
            document.getElementById('waTemplate').value = DEFAULT_TEMPLATE;
            localStorage.removeItem('customWaTemplate');
            showAlert('Format pesan dikembalikan ke standar.');
        }

        function showAlert(message, isError = false) {
            const alertBox = document.getElementById('customAlert');
            const alertIcon = document.getElementById('alertIcon');
            document.getElementById('alertText').textContent = message;
            alertIcon.className = isError ? "fa-solid fa-triangle-exclamation text-red-400" : "fa-solid fa-circle-check text-green-400";
            alertBox.classList.remove('-translate-y-32', 'opacity-0');
            setTimeout(() => alertBox.classList.add('-translate-y-32', 'opacity-0'), 3000);
        }

        function extractFolderId(url) {
            const match = url.match(/folders\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) return match[1];
            const matchId = url.match(/id=([a-zA-Z0-9-_]+)/);
            return matchId && matchId[1] ? matchId[1] : null;
        }

        function generateLink() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const clientName = document.getElementById('clientName').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const driveLink = document.getElementById('driveLink').value.trim();
            const kuota = document.getElementById('kuota').value.trim();

            if (!driveLink) return alert('Link Google Drive wajib diisi!');

            const folderId = extractFolderId(driveLink);
            if (!folderId) return showAlert('Link Google Drive tidak valid!', true);

            let finalUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
            let params = [];
            
            if (clientName !== "") {
                const cleanName = clientName.replace(/\s+/g, '-');
                params.push(`n=${encodeURIComponent(cleanName)}`);
            }

            if (kuota && parseInt(kuota) > 0) {
                // Enkripsi / Hashing Kuota sederhana
                const hashedKuota = btoa(kuota.toString()).replace(/=/g, '');
                params.push(`k=${hashedKuota}`);
            }
            
            params.push(`i=${folderId}`);
            finalUrl += '?' + params.join('&');

            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('finalUrl').value = finalUrl;

            const btnSendWA = document.getElementById('btnSendWA');
            if (clientPhone !== "") {
                btnSendWA.innerHTML = '<i class="fa-brands fa-whatsapp text-lg"></i> Kirim ke Klien';
            } else {
                btnSendWA.innerHTML = '<i class="fa-brands fa-whatsapp text-lg"></i> Buka WhatsApp';
            }
        }

        function getMessageTemplate(name, link) {
            let template = document.getElementById('waTemplate').value;
            let displayName = name ? `Kak ${name}` : "Kakak";
            return template.replace(/\[NAMA\]/g, displayName).replace(/\[LINK\]/g, link);
        }

        function copyToClipboard() {
            const finalUrl = document.getElementById('finalUrl').value;
            const clientName = document.getElementById('clientName').value.trim();
            
            let messageToCopy = getMessageTemplate(clientName, finalUrl);
            
            navigator.clipboard.writeText(messageToCopy).then(() => {
                showAlert('Teks pesan berhasil disalin!');
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = messageToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showAlert('Teks pesan berhasil disalin!');
            });
        }

        function sendToClientWA() {
            const finalUrl = document.getElementById('finalUrl').value;
            const clientName = document.getElementById('clientName').value.trim();
            
            let rawPhone = document.getElementById('clientPhone').value.replace(/[^0-9]/g, ''); 
            
            let finalPhone = rawPhone;
            if (finalPhone.startsWith('0')) {
                finalPhone = '62' + finalPhone.substring(1);
            }

            let message = getMessageTemplate(clientName, finalUrl);
            let waUrl = '';
            
            if (finalPhone) {
                waUrl = `https://wa.me/${finalPhone}?text=${encodeURIComponent(message)}`;
            } else {
                waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            }
            
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
